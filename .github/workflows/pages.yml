name: Deploy joining instructions to GitHub Pages

on:
  push:
    branches: ["claude/desaru-joining-instructions-x7g4e4"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, and let an in-flight deploy finish rather
# than cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: true creates the Pages site via the API on the first run,
        # so this does not need Pages switching on by hand beforehand.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble the published site
        # Publish the pages, their images and the hero video ONLY. README.md is
        # deliberately left out: it lists unresolved blockers and internal
        # committee notes, and a static deploy would otherwise serve it at
        # /README.md.
        #
        # lost-treasure.html is the unlisted dinner-game poster. It is never
        # linked from index.html, but it still has to be copied here or the
        # URL 404s for whoever it is handed to.
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp lost-treasure.html _site/
          if [ -d img ]; then
            cp -r img _site/img
            rm -f _site/img/README.md
          fi
          if [ -d media ]; then
            cp -r media _site/media
            rm -f _site/media/README.md
          fi
          touch _site/.nojekyll
          # Fail loudly rather than shipping a hero, or a game poster, that 404s.
          test -f _site/media/hero.mp4 || { echo "::error::media/hero.mp4 missing from the payload"; exit 1; }
          for f in \
            img/cards/back.webp img/cards/observer.webp \
            img/cards/sleight-of-hand.webp img/cards/deflector.webp \
            img/cards/thief.webp; do
            test -f "_site/$f" || { echo "::error::$f missing from the payload"; exit 1; }
          done
          echo "Publishing:"
          find _site -type f -exec du -h {} + | sort -k2

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
